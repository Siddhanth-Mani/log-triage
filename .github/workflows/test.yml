name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - name: Install and run the command
        run: |
          pip install .
          log-triage samples/auth.log samples/access.log --year 2026 --fail-on critical --min-severity high || test $? -eq 2
